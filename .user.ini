; PHP settings for FastCGI/FPM hosts (InfinityFree), where the php_flag
; lines in .htaccess are skipped because there is no mod_php to read them.
; Ignored by XAMPP's mod_php, which takes the .htaccess ones instead --
; so the two files together cover both, and neither can cause a 500.
display_errors = Off
log_errors = On
expose_php = Off
